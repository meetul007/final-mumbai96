{% extends "base.html" %}

{% block title %}Edit Review{% endblock %}

{% block content %}
    <h1 class="h3 mb-4">Edit Review: {{ review.entity }}</h1>

    <form method="post" class="card">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="card-body">

            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label">Entity</label>
                    <input class="form-control" value="{{ review.entity }}" readonly>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Category</label>
                    <input class="form-control" value="{{ review.category }}" readonly>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Area</label>
                    <input class="form-control" value="{{ review.area }}" readonly>
                </div>
            </div>

            <div class="row g-3 mb-4">
                <div class="col-md-2">
                    <label class="form-label">Rating</label>
                    <div style="font-size:24px;">
                        {% for i in range(review.rating) %}★{% endfor %}{% for i in range(5 - review.rating) %}☆{% endfor %}
                    </div>
                </div>
                <div class="col-md-5">
                    <label class="form-label">Review Title</label>
                    <input class="form-control" value="{{ review.title }}" readonly>
                </div>
                <div class="col-md-5">
                    <label class="form-label">Reviewer Name</label>
                    <input class="form-control" value="{{ review.reviewer_name }}" readonly>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label">Review Text</label>
                <textarea class="form-control" rows="5" readonly>{{ review.review }}</textarea>
            </div>

            {% if review.amount %}
            <div class="mb-4">
                <label class="form-label">Amount Involved</label>
                <input class="form-control" value="{{ review.amount }}" readonly>
            </div>
            {% endif %}

            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <label class="form-label">Helpful Count</label>
                    <input class="form-control" value="{{ review.helpful_count }}" readonly>
                </div>
                <div class="col-md-3">
                    <label class="form-label">&nbsp;</label>
                    <div class="form-check">
                        <input type="checkbox" name="is_approved" class="form-check-input" value="1" id="isApproved"
                               {% if review.is_approved %}checked{% endif %}>
                        <label class="form-check-label" for="isApproved">Approved (visible publicly)</label>
                    </div>
                </div>
            </div>

        </div>

        <div class="card-footer text-end">
            <a href="{{ url_for('admin.reviews') }}" class="btn btn-light">Cancel</a>
            <button type="submit" class="btn btn-primary">Save</button>
        </div>
    </form>
{% endblock %}
