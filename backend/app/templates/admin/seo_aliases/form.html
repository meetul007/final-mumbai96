{% extends "base.html" %}

{% block title %}Create SEO Alias{% endblock %}

{% block content %}
<h1 class="h3 mb-4">Create SEO Alias</h1>

<form method="post" class="card">
  <div class="card-body">

    <div class="mb-3">
      <label class="form-label">Alias Slug</label>
      <input type="text" name="slug" class="form-control">
      {% if errors and errors.slug %}
        <div class="text-danger small">{{ errors.slug }}</div>
      {% endif %}
    </div>

    <div class="mb-3">
      <label class="form-label">Category</label>
      <select name="category_id" class="form-select">
        <option value="">-- Select Category --</option>
        {% for c in categories %}
          <option value="{{ c.id }}">{{ c.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label class="form-label">Location</label>
      <select name="location_id" class="form-select">
        <option value="">-- Select Location --</option>
        {% for l in locations %}
          <option value="{{ l.id }}">{{ l.name }}</option>
        {% endfor %}
      </select>
    </div>

  </div>

  <div class="card-footer text-end">
    <a href="{{ url_for('admin.seo_aliases') }}" class="btn btn-light">Cancel</a>
    <button type="submit" class="btn btn-primary">Save</button>
  </div>
</form>
{% endblock %}
