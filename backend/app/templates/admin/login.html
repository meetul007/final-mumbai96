<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Admin Login | Mumbai96</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    rel="stylesheet">

  <style>
    body {
      min-height: 100vh;
      background: #f8fafc;
      font-family: "Jost", system-ui, sans-serif;
    }

    .auth-wrapper {
      min-height: 100vh;
      display: flex;
    }

    /* LEFT PANEL */
    .auth-form {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: #ffffff;
    }

    .auth-card {
      width: 100%;
      max-width: 380px;
    }

    .auth-title {
      font-size: 1.5rem;
      font-weight: 600;
    }

    .auth-subtitle {
      font-size: 0.85rem;
      color: #64748b;
    }

    .form-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #475569;
    }

    .form-control {
      border-radius: 8px;
      border-color: #e5e7eb;
      font-size: 0.9rem;
      padding: 0.55rem 0.75rem;
    }

    .form-control:focus {
      border-color: #c71f37;
      box-shadow: 0 0 0 0.15rem rgba(199, 31, 55, 0.15);
    }

    .btn-login {
      background: #c71f37;
      border-color: #c71f37;
      color: #fff;
      border-radius: 8px;
      font-weight: 500;
      padding: 0.6rem;
    }

    .btn-login:hover {
      background: #b61b31;
    }

    /* RIGHT PANEL */
    .auth-visual {
      flex: 1;
      background:
        linear-gradient(
          135deg,
          rgba(199, 31, 55, 0.95),
          rgba(226, 55, 68, 0.9)
        ),
        url("https://images.unsplash.com/photo-1504384308090-c894fdcc538d?auto=format&fit=crop&w=1200&q=80");
      background-size: cover;
      background-position: center;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem;
    }

    .auth-visual-content {
      max-width: 420px;
    }

    .auth-visual h2 {
      font-size: 2rem;
      font-weight: 700;
    }

    .auth-visual p {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    /* MOBILE */
    @media (max-width: 991px) {
      .auth-visual {
        display: none;
      }
    }
  </style>
</head>

<body>

<div class="auth-wrapper">

  <!-- LEFT: LOGIN FORM -->
  <div class="auth-form">
    <div class="auth-card">

      <h1 class="auth-title mb-1">Welcome Back</h1>
      <p class="auth-subtitle mb-4">
        Login to manage Mumbai96 listings
      </p>

      {% if error %}
        <div class="alert alert-danger small py-2">
          {{ error }}
        </div>
      {% endif %}

      <form method="post" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- EMAIL -->
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email"
                 name="email"
                 class="form-control"
                 placeholder="Please enter email address"
                 required>
        </div>

        <!-- PASSWORD -->
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password"
                 name="password"
                 class="form-control"
                 placeholder="••••••••"
                 required>
        </div>

        <button class="btn btn-login w-100">
          <i class="bi bi-box-arrow-in-right me-1"></i>
          Login
        </button>
      </form>

      <div class="text-muted small mt-4">
        © 2026 Mumbai96 Admin
      </div>

    </div>
  </div>

  <!-- RIGHT: BRAND PANEL -->
  <div class="auth-visual">
    <div class="auth-visual-content">
      <h2>Mumbai96 Admin</h2>
      <p class="mt-3">
        Manage businesses, locations, SEO listings and content
        across Mumbai with a powerful admin dashboard.
      </p>
    </div>
  </div>

</div>

</body>
</html>
