<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Admin | Mumbai96{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.snow.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/quill@1.3.7/dist/quill.min.js"></script>

<link href="/static/css/admin.css" rel="stylesheet">

  {% block extra_css %}{% endblock %}
</head>

<body class="admin-ui">

  {% include "admin/components/navbar.html" %}

  <div class="container-fluid" style="margin-top: 1rem;">
    <div class="row">

      {% include "admin/components/sidebar.html" %}

      <main class="col-md-9 col-lg-10 px-md-4 py-4">
        {% include "admin/components/flash.html" %}

        {% block content %}{% endblock %}
      </main>

    </div>
  </div>

  {% include "admin/components/footer.html" %}

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
  </script>

  {% block extra_js %}{% endblock %}

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const sidebar = document.getElementById("sidebarMenu");
    const links = sidebar.querySelectorAll("a.nav-link");

    links.forEach(link => {
      link.addEventListener("click", () => {
        if (window.innerWidth < 768) {
          const bsCollapse = bootstrap.Collapse.getInstance(sidebar);
          if (bsCollapse) {
            bsCollapse.hide();
          }
        }
      });
    });
  });
</script>

<div class="modal fade" id="imagePreviewModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content bg-dark">

      <div class="modal-body p-0 text-center">
        <img id="modalImage"
             src=""
             class="img-fluid"
             style="max-height:80vh;object-fit:contain;">
      </div>

      <button type="button"
              class="btn-close btn-close-white position-absolute top-0 end-0 m-2"
              data-bs-dismiss="modal">
      </button>

    </div>
  </div>
</div>

</body>
</html>
